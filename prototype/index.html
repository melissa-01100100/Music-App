<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111418" />
    <link rel="icon" href="data:," />
    <title>Chord Detect Prototype 0.1</title>
  </head>
  <body>
    <main class="app">
      <header class="top">
        <h1>Mic check</h1>
        <span class="build" id="build"></span>
      </header>

      <button id="start" class="big-btn primary" type="button">Start</button>
      <p id="status" class="status">Tap Start, then allow the microphone.</p>

      <section id="error" class="card error" hidden>
        <h2 id="error-title"></h2>
        <p id="error-help"></p>
        <p id="error-detail" class="small"></p>
      </section>

      <button id="resume" class="big-btn resume" type="button" hidden>Tap to resume</button>

      <section class="card meter-card" aria-label="Microphone level">
        <div class="readout">
          <span class="db" id="db">-- dB</span>
          <span class="clip" id="clip">CLIP</span>
        </div>
        <div class="meter" id="meter">
          <div class="meter-fill" id="meter-fill"></div>
          <div class="meter-peak" id="meter-peak"></div>
        </div>
        <div class="scale" id="scale"></div>
        <p class="peak-readout">Peak <span id="peak-db">--</span> dB</p>
        <p class="hint">Strum: the bar should reach green or amber. If it turns red, move the phone further away.</p>
      </section>

      <section class="card info-card">
        <div class="info-head">
          <h2>Device info</h2>
          <button id="copy" class="small-btn" type="button">Copy info</button>
        </div>
        <table class="info" id="info"></table>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
